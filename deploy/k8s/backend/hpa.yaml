apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unified-documents-api
  namespace: keyloop
  labels:
    app.kubernetes.io/name: unified-documents
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unified-documents-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70